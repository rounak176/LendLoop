services:
  n8n:
    image: n8nio/n8n:2.46.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env.n8n
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_CUSTOM_EXTENSIONS: /opt/lendloop-custom
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/custom:/opt/lendloop-custom:ro
      - ./n8n/workflows:/opt/lendloop-workflows:ro
      - ./.n8n-credentials.local.json:/opt/lendloop-credentials.json:ro

  webhook-gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    volumes:
      - ./n8n/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
  tunnel:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    depends_on:
      - webhook-gateway
    command: tunnel --no-autoupdate --url http://webhook-gateway:8080

volumes:
  n8n_data: